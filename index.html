<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Decorium — 3D-игра о дизайне интерьеров для авторских клиентских брифов" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Decorium</title>
  </head>
  <body>
    <main id="app">
      <canvas id="room-canvas" aria-label="3D-сцена комнаты"></canvas>

      <section class="brand panel" aria-label="Decorium">
        <div class="brand-logo">D</div>
        <div class="brand-text">
          <b>Decorium</b>
          <small>Interior Design Game</small>
        </div>
      </section>

      <aside id="catalog-container" class="library panel" aria-label="Каталог предметов"></aside>
      <aside id="dashboard-container" class="dashboard panel" aria-label="Панель оценки"></aside>
      <aside id="design-inspector-container" class="design-inspector panel" aria-label="Настройка интерьера"></aside>
      <aside id="profile-container" class="profile-panel panel" aria-label="Статус профиля"></aside>
      <aside id="settings-container" class="settings-panel panel" aria-label="Настройки игрока"></aside>
      <aside id="level-select-container" class="level-select-panel panel" aria-label="Выбор уровня"></aside>
      <header id="toolbar-container" class="toolbar panel" aria-label="Управление"></header>
      <div id="evaluation-container" aria-live="polite"></div>
      <aside id="release-info-container" class="release-info-panel" aria-label="Сведения о версии"></aside>
      <div id="boot-status" class="boot-status panel">Загрузка комнаты…</div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
